name: Causal original memory baseline and actual default Git pywin32 prerequisite
'on':
  push:
    branches:
    - stablekite/native2-causal-memory-and-pywin32-v3
jobs:
  baseline-original314x86:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os:
        - windows-latest
        python-version:
        - '3.14'
        architecture:
        - x86
        support:
        - without 3rd parties
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 32d35736baad96b72097fd13cc89870c6f9dbf0e
    - name: Verify exact qualified source
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "32d35736baad96b72097fd13cc89870c6f9dbf0e"

        '
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build and register the OutProc COM server
      run: 'cd source/CppTestSrv

        nmake /f Makefile

        ./server.exe /RegServer

        '
    - name: unittest comtypes
      run: "if (\"${{ matrix.support }}\" -eq \"with 3rd parties\") {\n  pip install numpy\n  pip install pywin32\n}\npip install coverage[toml]\ncoverage run -m unittest discover -v -s comtypes\\test -t comtypes\\test\n"
    - name: Unregister the OutProc COM server
      run: 'cd source/CppTestSrv

        ./server.exe /UnregServer

        '
    - name: Retain actual measured coverage for the required publisher
      run: coverage xml -o coverage.xml
    - name: Retain exact coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: baseline-original314x86
        path: coverage.xml
        if-no-files-found: error
  candidate-native2-314x86:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os:
        - windows-latest
        python-version:
        - '3.14'
        architecture:
        - x86
        support:
        - without 3rd parties
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5
    - name: Verify exact qualified source
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5"

        '
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build and register the OutProc COM server
      run: 'cd source/CppTestSrv

        nmake /f Makefile

        ./server.exe /RegServer

        '
    - name: unittest comtypes
      run: "if (\"${{ matrix.support }}\" -eq \"with 3rd parties\") {\n  pip install numpy\n  pip install pywin32\n}\npip install coverage[toml]\ncoverage run -m unittest discover -v -s comtypes\\test -t comtypes\\test\n"
    - name: Unregister the OutProc COM server
      run: 'cd source/CppTestSrv

        ./server.exe /UnregServer

        '
    - name: Retain actual measured coverage for the required publisher
      run: coverage xml -o coverage.xml
    - name: Retain exact coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: candidate-native2-314x86
        path: coverage.xml
        if-no-files-found: error
  native315t-real-default-pywin32:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os:
        - windows-latest
        python-version:
        - 3.15t
        architecture:
        - x64
        support:
        - with 3rd parties
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5
    - name: Verify exact qualified source
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5"

        '
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build and register the OutProc COM server
      run: 'cd source/CppTestSrv

        nmake /f Makefile

        ./server.exe /RegServer

        '
    - name: Install actual Root-qualified default Git pywin32 missing from PyPI315t
      shell: pwsh
      run: 'python -m pip install git+https://github.com/StableKite/pywin32.git

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        python -c "import importlib.metadata as m,json,sys,pythoncom,pywintypes,win32api,win32gui; d=m.distribution(''pywin32''); u=json.loads(d.read_text(''direct_url.json'')); assert d.version==''312.1''; assert u[''vcs_info''][''commit_id'']==''df59f200af01a37de0b1b85312785756c32cbb0a''; assert ''requested_revision'' not in u[''vcs_info'']; assert sys.flags.gil is None and not sys._is_gil_enabled(); print(u)"

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: unittest comtypes
      run: "if (\"${{ matrix.support }}\" -eq \"with 3rd parties\") {\n  pip install numpy\n  pip install pywin32\n}\npip install coverage[toml]\ncoverage run -m unittest discover -v -s comtypes\\test -t comtypes\\test\n"
    - name: Unregister the OutProc COM server
      run: 'cd source/CppTestSrv

        ./server.exe /UnregServer

        '
    - name: Verify natural GIL off after importing real native dependencies
      shell: pwsh
      run: "python -c \"import ctypes,sys,comtypes.client; assert sys.flags.gil is None and not sys._is_gil_enabled(); print(sys.version)\"\nif (\"${{ matrix.support }}\" -eq \"with 3rd parties\") {\n  python -c \"import ctypes,sys,comtypes.client,numpy,pythoncom,win32api; assert sys.flags.gil is None and not sys._is_gil_enabled()\"\n}\n"
    - name: Retain actual measured coverage for the required publisher
      run: coverage xml -o coverage.xml
    - name: Retain exact coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: native315t-real-default-pywin32
        path: coverage.xml
        if-no-files-found: error
