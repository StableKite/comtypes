name: Original comtypes matrix and real 3.15t with native ownership fixes
'on':
  push:
    branches:
    - stablekite/python315-native2-original-ci-v1
jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os:
        - windows-latest
        python-version:
        - '3.9'
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        architecture:
        - x86
        - x64
        support:
        - with 3rd parties
        - without 3rd parties
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5
    - name: Verify exact qualified source
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5"

        '
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build and register the OutProc COM server
      run: 'cd source/CppTestSrv

        nmake /f Makefile

        ./server.exe /RegServer

        '
    - name: unittest comtypes
      run: "if (\"${{ matrix.support }}\" -eq \"with 3rd parties\") {\n  pip install numpy\n  pip install pywin32\n}\npip install coverage[toml]\ncoverage run -m unittest discover -v -s comtypes\\test -t comtypes\\test\n"
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        use_oidc: true
        fail_ci_if_error: true
        network_filter: comtype
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Unregister the OutProc COM server
      run: 'cd source/CppTestSrv

        ./server.exe /UnregServer

        '
  install-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - windows-2025
        - windows-2022
        python-version:
        - '3.9'
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
        - '3.14'
        architecture:
        - x86
        - x64
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5
    - name: Verify exact qualified source
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5"

        '
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}
    - name: install comtypes
      run: 'pip install --upgrade build

        python -m pip install .

        pip uninstall comtypes -y

        python test_pip_install.py

        '
  docs-source-doctest:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5
    - name: Verify exact qualified source
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5"

        '
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        architecture: x64
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r docs/requirements.txt

        '
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Compile IDL
      run: midl /out docs\source docs\source\mytypelib.idl
    - name: Run doctest
      run: sphinx-build -b doctest -d docs/build/doctrees docs/source docs/build/doctest
      working-directory: ./
  formatter:
    name: auto-formatter
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: 473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5
    - name: Verify exact qualified source
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5"

        '
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.9
    - name: Install ruff
      run: pip install ruff==0.6.9
    - name: Check format
      run: python -m ruff format test_pip_install.py comtypes/. --check --diff
    - name: Check lint
      run: python -m ruff check --output-format=github test_pip_install.py comtypes/.
  native315t-tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os:
        - windows-latest
        python-version:
        - 3.15t
        architecture:
        - x64
        support:
        - with 3rd parties
        - without 3rd parties
    steps:
    - uses: actions/checkout@v6
      with:
        ref: 473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5
    - name: Verify exact qualified source
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "473fbb76a8dfe8a4aacba19ef5151f69d28b4ec5"

        '
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}
    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build and register the OutProc COM server
      run: 'cd source/CppTestSrv

        nmake /f Makefile

        ./server.exe /RegServer

        '
    - name: unittest comtypes
      run: "if (\"${{ matrix.support }}\" -eq \"with 3rd parties\") {\n  pip install numpy\n  pip install pywin32\n}\npip install coverage[toml]\ncoverage run -m unittest discover -v -s comtypes\\test -t comtypes\\test\n"
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        use_oidc: true
        fail_ci_if_error: true
        network_filter: comtype
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Unregister the OutProc COM server
      run: 'cd source/CppTestSrv

        ./server.exe /UnregServer

        '
    - name: Verify natural GIL off after importing real native dependencies
      shell: pwsh
      run: "python -c \"import ctypes,sys,comtypes.client; assert sys.flags.gil is None and not sys._is_gil_enabled(); print(sys.version)\"\nif (\"${{ matrix.support }}\" -eq \"with 3rd parties\") {\n  python -c \"import ctypes,sys,comtypes.client,numpy,pythoncom,win32api; assert sys.flags.gil is None and not sys._is_gil_enabled()\"\n}\n"
